<div class="fondo-pagina" [class.modo-claro]="!isDarkMode" aria-hidden="true">
<app-cursor-personalizado></app-cursor-personalizado>
<svg class="cuadricula" xmlns="http://www.w3.org/2000/svg">
  <line x1="7%" y1="0" x2="7%" y2="100%"></line>
  <line x1="50%" y1="0" x2="50%" y2="100%"></line>
  <line x1="93%" y1="0" x2="93%" y2="100%"></line>
  <line x1="0" y1="34%" x2="100%" y2="34%"></line>
  <line x1="0" y1="68%" x2="100%" y2="68%"></line>
  <g class="cruces">
    <line x1="7%" y1="calc(34% - 7px)" x2="7%" y2="calc(34% + 7px)"></line>
    <line x1="calc(7% - 7px)" y1="34%" x2="calc(7% + 7px)" y2="34%"></line>
    <line x1="50%" y1="calc(34% - 7px)" x2="50%" y2="calc(34% + 7px)"></line>
    <line x1="calc(50% - 7px)" y1="34%" x2="calc(50% + 7px)" y2="34%"></line>
    <line x1="93%" y1="calc(34% - 7px)" x2="93%" y2="calc(34% + 7px)"></line>
    <line x1="calc(93% - 7px)" y1="34%" x2="calc(93% + 7px)" y2="34%"></line>
    <line x1="7%" y1="calc(68% - 7px)" x2="7%" y2="calc(68% + 7px)"></line>
    <line x1="calc(7% - 7px)" y1="68%" x2="calc(7% + 7px)" y2="68%"></line>
    <line x1="50%" y1="calc(68% - 7px)" x2="50%" y2="calc(68% + 7px)"></line>
    <line x1="calc(50% - 7px)" y1="68%" x2="calc(50% + 7px)" y2="68%"></line>
    <line x1="93%" y1="calc(68% - 7px)" x2="93%" y2="calc(68% + 7px)"></line>
    <line x1="calc(93% - 7px)" y1="68%" x2="calc(93% + 7px)" y2="68%"></line>
  </g>
</svg>
</div>
<div
  class="container-fluid pb-5 lienzo"
  [ngClass]="isDarkMode ? 'bg-dark' : 'bg-light'"
  [class.modo-claro]="!isDarkMode"
>
  <div
    class="row container d-flex mx-auto justify-content-center align-items-center"
  >
    <div class="col-md-12 mb-5 mt-5 pb-5">
      <nav class="navbar navbar-expand-lg mt-2 fixed-top">
        <ul
          class="barra-nav d-flex flex-row rounded-5 border-0 p-2 ps-4 pe-4 justify-content-center align-items-center gap-4 list-unstyled m-auto"
        >
          <li class="nav-item">
            <a class="nav-link fw-semibold color-header" href="#experience" [class.activo]="seccionActiva === 'experience'"
              ><i class="bi bi-person-workspace"></i>
              <span class="text"> Experiencia</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold color-header" href="#education" [class.activo]="seccionActiva === 'education'"
              ><i class="bi bi-mortarboard"></i>
              <span class="text"> Educación</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold color-header" href="#skills" [class.activo]="seccionActiva === 'skills'"
              ><i class="bi bi-heart"></i>
              <span class="text"> Habilidades</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold color-header" href="#projects" [class.activo]="seccionActiva === 'projects'"
              ><i class="bi bi-code-slash"></i>
              <span class="text"> Proyectos</span>
            </a>
          </li>
          <!-- <li class="nav-item">
            <a class="nav-link fw-semibold color-header" href="#contact"
              ><i class="bi bi-envelope-paper"></i>
              <span class="text"> Contacto</span>
            </a>
          </li> -->
          <li>
            <a>
              <label class="toggle" for="switch" aria-label="Cambiar entre modo claro y oscuro">
                <input
                  id="switch"
                  class="input"
                  type="checkbox"
                  [checked]="!isDarkMode"
                  (change)="toggleTheme()"
                />
                <div class="icon icon--moon">
                  <svg
                    height="23"
                    width="23"
                    fill="currentColor"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      clip-rule="evenodd"
                      d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"
                      fill-rule="evenodd"
                    ></path>
                  </svg>
                </div>
                <div class="icon icon--sun">
                  <svg
                    height="25"
                    width="25"
                    fill="currentColor"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"
                    ></path>
                  </svg>
                </div>
              </label>
            </a>
          </li>
        </ul>
      </nav>
    </div>
    <div class="col-lg-8 col-12 mb-4 mt-5 pb-5">
      <div class="pb-3 entrada-hero">
        <div class="hero-grilla">
          <div class="hero-texto text-center text-lg-start">
            <h1 class="nombre-principal">
              <app-texto-particulas texto="Daniel José Giacinto" [oscuro]="isDarkMode"></app-texto-particulas>
            </h1>
            <p class="rol-principal text-center text-lg-start mb-0" appTextoHover>Full Stack Developer</p>
            <div class="acciones-hero">
              <a class="boton-pill boton-pill-contorno boton-pill-hero" href="#contacto">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path>
                  <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
                  <path d="M10 9H8"></path>
                  <path d="M16 13H8"></path>
                  <path d="M16 17H8"></path>
                </svg>
                Contáctame
              </a>
            </div>
          </div>
          <div class="hero-foto">
            <div class="marco-foto">
              <span class="marco-foto-fondo" aria-hidden="true"></span>
              <div class="marco-foto-recorte">
                <img src="assets/foto-perfil.png" alt="Daniel José Giacinto" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-8 col-sm-12 col-xs-12 mt-5">
      <div id="experience" class="mt-5 pb-5" appScrollAnimation>
        <app-experience></app-experience>
      </div>
      <div id="education" class="mt-5 pb-5" appScrollAnimation>
        <app-education></app-education>
      </div>
      <div id="skills" class="mt-5 pb-5" appScrollAnimation>
        <app-skills></app-skills>
      </div>
      <div id="projects" class="mt-5 pb-5" appScrollAnimation>
        <app-projects></app-projects>
      </div>
    </div>
  </div>

  <footer id="contacto" class="cierre text-center">
    <p class="cierre-titulo titulo-display" appTextoHover [ngClass]="isDarkMode ? 'text-white' : 'text-dark'">¿Creamos algo juntos?</p>
    <div class="contacto-acciones">
      <a class="boton-pill boton-pill-lleno" href="https://wa.me/5493534067588" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        +54 353 4067588
      </a>
      <a class="boton-pill boton-pill-contorno" href="https://www.linkedin.com/in/danielgiacinto/" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect width="4" height="12" x="2" y="9"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
        LinkedIn
      </a>
      <a class="boton-pill boton-pill-contorno" href="mailto:danielgiacinto@gmail.com">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        Correo
      </a>
    </div>
    <p class="cierre-nota mb-0 mt-4" [ngClass]="isDarkMode ? 'text-white' : 'text-secondary'">© 2026 Daniel José Giacinto · Córdoba, Argentina</p>
  </footer>

  <!-- Botón Scroll to Top -->
  <button 
    *ngIf="showScrollTop"
    (click)="scrollToTop()"
    class="scroll-to-top"
    [class.modo-claro]="!isDarkMode"
    aria-label="Volver arriba"
    title="Volver arriba">
    <i class="bi bi-arrow-up-circle-fill"></i>
  </button>
</div>
